# MyOS backend - Alembic configuration.
#
# The database URL is NOT stored here: alembic/env.py reads MYOS_DATABASE_URL (with the
# same default as the app, see app/core/config.py), so `python -m alembic upgrade head`
# always targets the database the running application uses.

[alembic]
script_location = alembic
prepend_sys_path = .
# alembic >= 1.13 renamed version_path_separator; without this key it falls back to
# splitting on spaces/commas/colons, which trips a DeprecationWarning on every run.
path_separator = os

# Fallback only - env.py overrides this from the environment.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
